name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Agent policy
        run: ./scripts/check-agent-policy.sh
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build -o /tmp/ms-go-validation-orchestrator ./cmd/ms-go-validation-orchestrator
