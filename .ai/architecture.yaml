schema_version: 1
style: ports_and_adapters
layers:
  - name: domain
    paths: [internal/domain]
    owns: [validation contract, request, result, engine port, verification workspace file port, errors]
  - name: usecase
    paths: [internal/usecase]
    owns: [parsing, legacy adaptation, filtering, dependency ordering, orchestration, links]
  - name: infrastructure
    paths: [internal/infrastructure/http, internal/infrastructure/logging, internal/infrastructure/workspace]
    owns: [validator-specific request mapping and response normalization, bounded readonly verification fixture file transport]
  - name: transport
    paths: [internal/transport/http, dto, mapper, public]
    owns: [HTTP API, DTO mapping, public client]
  - name: composition
    paths: [internal/app, config, cmd]
    owns: [configuration, engine registration, server lifecycle]
execution_flow:
  - decode request
  - parse V1 contract or adapt legacy payload
  - filter stages by requested mode
  - topologically order retained stages
  - execute stages sequentially
  - evaluate retained links
  - aggregate normalized result
  - derive bounded teacher explanation from normalized result
practice_validation_v2_flow:
  - strictly decode correlated Practice Runtime command
  - recompute the scoped immutable validation-contract digest
  - fetch and verify the exact retained Sandbox snapshot
  - execute frozen V1 stage contracts in deterministic order with per-stage deadlines
  - return typed PASS, FAIL, or ERROR with sanitized stage summaries
authoring_verification_flow:
  - inspect the final contract and exact portable case roots
  - use actual adapter input declarations and retained FINAL links to determine whether files are needed
  - read each case once through the explicitly composed local workspace file port only when a retained consumer needs files
  - execute with original portable root plus bounded text files
  - reject reader or engine execution errors without exposing private contents or host paths
  - return only outcome booleans and result digests
invariants:
  - domain and usecase packages do not depend on HTTP transport
  - authoring filesystem access lives only in infrastructure/workspace; ordinary Execute and official Practice V2 never hydrate local roots
  - root-only authoring keeps original dispatch without a new Orchestrator mount prerequisite; unknown adapter inputs are not inferred from public capabilities
  - engine-specific validation remains outside this service
  - stage IDs are unique and dependencies resolve within the retained stage set
  - dependency cycles reject the request
  - configured engine IDs are returned in sorted order
  - teacher explanation is presentation-only, preserves passed, excludes optional/warnings/raw output, and is capped at five issues and 16 KiB
known_limits:
  - V1 core contract parsing is strict, but engine-specific rules and checks remain opaque JSON
  - only ts.runtime, java.runtime, kotlin.runtime, and browser.runtime are hard final-only
  - omitted request mode runs every authored stage, including final-only engines
  - V1 stage timeout_seconds is forwarded but not enforced by a per-stage context
  - Practice V2 verifies pinned generation identity and workspace digest before execution
  - stages have no concurrency
  - links with dependencies removed by mode filtering are silently omitted
  - root-backed workspace.required_files are delegated to sandbox-mounted engines; inline workspaces are enforced locally
  - duplicate engine IDs are deduplicated by the compatibility constructor instead of rejecting application startup
