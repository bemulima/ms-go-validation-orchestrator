schema_version: test-manifest.v1
manifest_version: "1.0.0"
policy_version: testing-policy.v1

repository:
  id: ms-go-validation-orchestrator
  profile: GO_SERVICE
  stack:
    language: Go
    runtime:
      name: go
      version: "1.25.0"

suites:
