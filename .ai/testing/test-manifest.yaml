commands:
  "test:unit":
    availability: AVAILABLE
    invoke: ["go", "test", "./...", "-count=1"]
    working_directory: .
    timeout_seconds: 2400
  "test:transport":
    availability: AVAILABLE
    invoke: ["go", "test", "./internal/transport/http/..."]
    working_directory: .
    timeout_seconds: 1800
  "test:integration":
    availability: AVAILABLE
    invoke: ["go", "test", "./internal/infrastructure/http/...", "-count=1"]
    working_directory: .
    timeout_seconds: 1800
  "test:contract":
    availability: AVAILABLE
    invoke: ["go", "test", "./...", "-count=1"]
    working_directory: .
    timeout_seconds: 2400
  "check:types":
    availability: AVAILABLE
    invoke: ["go", "vet", "./..."]
    working_directory: .
    timeout_seconds: 1800
  "test:persistence":
    availability: UNAVAILABLE
    reason: "No dedicated policy-runnable test:persistence command is registered at the audited committed HEAD."
  "test:integration:deps":
    availability: UNAVAILABLE
    reason: "No dedicated policy-runnable test:integration:deps command is registered at the audited committed HEAD."
  "test:migration":
    availability: UNAVAILABLE
    reason: "No dedicated policy-runnable test:migration command is registered at the audited committed HEAD."
  "test:events":
    availability: UNAVAILABLE
    reason: "No dedicated policy-runnable test:events command is registered at the audited committed HEAD."
