schema_version: 1
name: implement-feature
steps:
  - define acceptance criteria and owned capability
  - identify affected contracts, engine consumers, and compatibility constraints
  - implement within domain, usecase, adapter, transport, or composition boundaries
  - add success, failure, and mode/dependency tests as applicable
  - update repository-owned docs and examples
  - run policy, format, vet, test, and build checks
  - request independent review
