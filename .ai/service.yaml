schema_version: 1
name: ms-go-validation-orchestrator
service_kind: backend_service
repository_role: validation_orchestrator
repository:
  git_url: https://github.com/bemulima/ms-go-validation-orchestrator.git
  default_branch: main
purpose: Parse validation contracts, plan stages, call configured validator engines, evaluate simple workspace links, and normalize results.
owned_capabilities:
  - contract parsing and legacy adaptation
  - stage mode filtering and deterministic dependency ordering
  - engine registration and HTTP adapter dispatch
  - link evaluation
  - normalized validation-result aggregation
  - bounded teacher-validation-explanation.v1 projection from normalized results
  - versioned configured-engine capability discovery
  - authoring-time contract inspection
  - executable starter/reference/negative fixture verification receipts
not_owned:
  - language and framework parsing
  - student-code execution
  - sandbox provisioning and workspace path discovery
  - task authoring and persistence
  - authentication and authorization
  - validation-result persistence, Teacher delivery, or workspace-revision binding
entrypoints:
  application: internal/app/app.go
  executable: cmd/ms-go-validation-orchestrator
  http_router: internal/transport/http/router.go
source_of_truth:
  behavior: [internal, dto, mapper, public]
  tests: [internal]
  documentation: docs/README.md
  contracts: [.ai/contracts/http.yaml, .ai/contracts/orchestration.yaml, .ai/contracts/engines.yaml]
dependencies:
  configured_by_environment: true
  transport: HTTP
  engine_catalog_source: internal/app/app.go
security:
  authentication: X-Internal-Token on /api/v1
  authorization: service-level internal caller boundary
  request_body_limit: 2 MiB
  response_body_limit: 4 MiB for engine and public-client responses
  workspace_root_containment: exact /workspaces/<sandbox-id> portable namespace
delivery:
  commands: .ai/commands.yaml
  workflows: .ai/workflows
  policy_check: scripts/check-agent-policy.sh
